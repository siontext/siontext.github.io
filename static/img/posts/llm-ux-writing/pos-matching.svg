<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <rect x="20" y="20" width="460" height="290" rx="14" fill="#F3F4F7" stroke="#A3ABBA" stroke-width="2"/>
  <rect x="520" y="20" width="460" height="290" rx="14" fill="#E3EEFC" stroke="#3B7DD8" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="250" y="58" font-size="20" font-weight="700" fill="#1F2633">글자로만 찾기</text>
    <text x="250" y="84" font-size="14" fill="#4A5363">'본'이 들어 있으면 걸기</text>
    <text x="750" y="58" font-size="20" font-weight="700" fill="#10243F">품사까지 보기</text>
    <text x="750" y="84" font-size="14" fill="#2F4A6E">POS-aware Matching · 관형사 '본'만 걸기</text>
  </g>
  <g font-size="17">
    <rect x="40" y="108" width="420" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8E0"/>
    <text x="60" y="140" fill="#1F2633"><tspan font-weight="700" fill="#C23B3B">본</tspan> 서비스를 이용하려면</text>
    <rect x="40" y="208" width="420" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8E0"/>
    <text x="60" y="240" fill="#1F2633"><tspan font-weight="700" fill="#C23B3B">본</tspan>인 확인이 필요해요</text>
    <rect x="540" y="108" width="420" height="80" rx="10" fill="#FFFFFF" stroke="#B7CFF2"/>
    <text x="560" y="140" fill="#10243F">본 서비스를 이용하려면</text>
    <rect x="540" y="208" width="420" height="80" rx="10" fill="#FFFFFF" stroke="#B7CFF2"/>
    <text x="560" y="240" fill="#10243F">본인 확인이 필요해요</text>
  </g>
  <g font-size="13">
    <rect x="560" y="152" width="74" height="24" rx="6" fill="#FDE4E4" stroke="#D64545"/>
    <text x="597" y="169" text-anchor="middle" fill="#7A1F1F">본/관형사</text>
    <rect x="640" y="152" width="74" height="24" rx="6" fill="#EEF1F5" stroke="#A3ABBA"/>
    <text x="677" y="169" text-anchor="middle" fill="#3A4253">서비스/명사</text>
    <rect x="560" y="252" width="74" height="24" rx="6" fill="#EEF1F5" stroke="#A3ABBA"/>
    <text x="597" y="269" text-anchor="middle" fill="#3A4253">본인/명사</text>
    <rect x="640" y="252" width="74" height="24" rx="6" fill="#EEF1F5" stroke="#A3ABBA"/>
    <text x="677" y="269" text-anchor="middle" fill="#3A4253">확인/명사</text>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="350" y="133" width="90" height="32" rx="16" fill="#FDE4E4" stroke="#D64545"/>
    <text x="395" y="154" fill="#7A1F1F">걸림</text>
    <rect x="320" y="233" width="120" height="32" rx="16" fill="#FDEFE3" stroke="#D9822B"/>
    <text x="380" y="254" fill="#4A2A0B">걸림 (잘못)</text>
    <rect x="850" y="133" width="90" height="32" rx="16" fill="#FDE4E4" stroke="#D64545"/>
    <text x="895" y="154" fill="#7A1F1F">걸림</text>
    <rect x="850" y="233" width="90" height="32" rx="16" fill="#E4F5EA" stroke="#2E9E5B"/>
    <text x="895" y="254" fill="#123B24">통과</text>
  </g>
</svg>
